<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Post Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/FeedPage.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="text-end p-2">
      <a href="/Post.html" class="btn btn-primary w-25">New Post</a>
    <a href="/Login.html" class="btn btn-danger w-25">Logout</a>
    </div>

     <div class="allPosts" id="allPosts">

</div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    <script>

async function loadPosts(){

    const userID = localStorage.getItem("userID");

    const response = await fetch(`http://localhost:3000/getMyPosts?userID=${userID}`);

    const posts = await response.json();

    const allPosts = document.getElementById("allPosts");

    allPosts.innerHTML="";

    posts.forEach(post => {

    allPosts.innerHTML += `<div class="Post">
            <h1>${post.title}</h1>

  <p>
${
    post.description.length > 150
    ? post.description.substring(0,150) + "..."
    : post.description
}
 </p>

  <a href="DedicatedPage.html?id=${post.ID}" class="btn viewPostButton text-white">View Post</a>

<button class="btn btn-danger ms-2" onclick="deletePost(${post.ID})">Delete</button>
  </div>`;

});
}

loadPosts();

async function deletePost(id){

    const confirmDelete = confirm("Are you sure you want to delete this post?");

    if(!confirmDelete){
        return;
    }

    const response = await fetch(`http://localhost:3000/deletePost?id=${id}`,{
        method:"DELETE"
    });

    const text = await response.text();

    alert(text);

    loadPosts();

}

</script>
  </body>
</html>
