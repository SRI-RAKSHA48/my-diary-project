<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Diary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #f8d7da, #dbeafe);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
        }

        .card {
            width: 450px;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background: white;
        }

        h1 {
            font-size: 45px;
            font-weight: 700;
            color: #6f42c1;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .btn-custom {
            width: 100%;
            border-radius: 25px;
            padding: 12px;
            margin-top: 15px;
            font-size: 18px;
            background: #6f42c1;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background: #59359c;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>My Diary ✨</h1>

    <p>
        Capture your thoughts, memories and moments in one beautiful place.
    </p>

    <a href="Register.html">
        <button class="btn-custom">Create Account</button>
    </a>

    <a href="Login.html">
        <button class="btn-custom">Login</button>
    </a>

</div>

</body>
</html>
